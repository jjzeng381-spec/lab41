<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人机验证</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
        }
        h1 {
            font-size: 22px;
            color: #1a1a2e;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        .captcha-box {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px;
            background: #fafafa;
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }
        .captcha-box.verified {
            border-color: #4caf50;
            background: #f1f8f1;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }
        .custom-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #ccc;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            background: white;
        }
        .custom-checkbox.checked {
            background: #4caf50;
            border-color: #4caf50;
        }
        .custom-checkbox.checked::after {
            content: "✓";
            color: white;
            font-size: 16px;
            font-weight: bold;
        }
        .checkbox-label {
            font-size: 15px;
            color: #333;
        }
        .status {
            margin-top: 12px;
            font-size: 13px;
            color: #4caf50;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .status.show {
            display: flex;
        }
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        .spinner.show {
            display: inline-block;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            opacity: 0.5;
            pointer-events: none;
        }
        .btn.active {
            opacity: 1;
            pointer-events: auto;
        }
        .btn.active:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .btn:active {
            transform: translateY(0);
        }
        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #999;
        }
        .success-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: none;
        }
        .success-icon.show {
            display: block;
            animation: bounce 0.5s ease;
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container" id="mainBox">
        <div class="logo">🔒</div>
        <h1>人机验证</h1>
        <p class="subtitle">为了保护系统安全，请完成以下验证</p>

        <div class="captcha-box" id="captchaBox">
            <div class="checkbox-row" id="checkRow">
                <div class="custom-checkbox" id="checkbox"></div>
                <span class="checkbox-label">我不是机器人</span>
                <div class="spinner" id="spinner"></div>
            </div>
            <div class="status" id="status">
                <span>✓ 验证通过</span>
            </div>
        </div>

        <button class="btn" id="submitBtn">继续访问</button>

        <p class="footer">安全验证 · 保护您的访问体验</p>
    </div>

    <div class="container hidden" id="successBox">
        <div class="success-icon show">✅</div>
        <h1>验证成功</h1>
        <p class="subtitle">正在跳转，请稍候...</p>
    </div>

    <script>
        const checkbox = document.getElementById('checkbox');
        const checkRow = document.getElementById('checkRow');
        const captchaBox = document.getElementById('captchaBox');
        const spinner = document.getElementById('spinner');
        const status = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        const mainBox = document.getElementById('mainBox');
        const successBox = document.getElementById('successBox');

        let verified = false;

        checkRow.addEventListener('click', function() {
            if (verified) return;

            // 显示加载动画
            spinner.classList.add('show');
            checkbox.style.opacity = '0.5';

            // 模拟验证过程（随机 0.8~1.5 秒）
            const delay = 800 + Math.random() * 700;
            setTimeout(() => {
                spinner.classList.remove('show');
                checkbox.style.opacity = '1';
                checkbox.classList.add('checked');
                captchaBox.classList.add('verified');
                status.classList.add('show');
                submitBtn.classList.add('active');
                verified = true;
            }, delay);
        });

        submitBtn.addEventListener('click', function() {
            if (!verified) return;

            // 显示成功界面
            mainBox.classList.add('hidden');
            successBox.classList.remove('hidden');

            // 1.2 秒后跳转
            setTimeout(() => {
                window.location.href = 'https://v.wjx.cn/vm/PHGynBk.aspx';
            }, 1200);
        });
    </script>
</body>
</html>
